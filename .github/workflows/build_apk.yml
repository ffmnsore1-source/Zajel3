name: Build Flutter APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
      
      - name: Setup Modern Project Environment & Build
        run: |
          # الاحتفاظ بنسخة آمنة من كود المشروع الأصلي
          mkdir -p secure_backup
          if [ -d "lib" ]; then cp -r lib secure_backup/; fi
          if [ -f "pubspec.yaml" ]; then cp pubspec.yaml secure_backup/; fi
          
          # إنشاء هيكل أندرويد حديث ونظيف كلياً
          flutter create . --org com.example --project-name zajel_app --platforms=android
          
          # استعادة كود التطبيق الخاص بك
          if [ -d "secure_backup/lib" ]; then rm -rf lib/* && cp -r secure_backup/lib/* lib/; fi
          if [ -f "secure_backup/pubspec.yaml" ]; then cp secure_backup/pubspec.yaml ./; fi
          
          # تحديث إعدادات الأندرويد ورفع minSdk إلى 23
          BUILD_FILE="android/app/build.gradle"
          if [ -f "$BUILD_FILE" ]; then
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/g' "$BUILD_FILE"
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/g' "$BUILD_FILE"
          fi
          
          # ضبط وتحديث نسخة كوتلن بشكل حديث ليتوافق مع أحدث المتطلبات
          SETTINGS_FILE="android/settings.gradle"
          if [ -f "$SETTINGS_FILE" ]; then
            sed -i "s/version '1.8.22' version '1.9.24'/g" "$SETTINGS_FILE" || true
          fi

      - run: flutter pub get
      - run: flutter build apk --release --no-shrink --no-tree-shake-icons
