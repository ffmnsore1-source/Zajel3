            Future<void> _startRecording() async {
              try {
                if (await _audioRecorder.hasPermission()) {
                  final tempDir = Directory.systemTemp;
                  final path = '${tempDir.path}/zajel_audio_${DateTime.now().millisecondsSinceEpoch}.aac';
                  await _audioRecorder.start(
                    const RecordConfig(encoder: AudioEncoder.aacLc),
                    path: path,
                  );
                  setState(() {
                    _isRecordingActive = true;
                    _isLocked = false;
                    _currentDragY = 0.0;
                  });
                }
              } catch (e) {
                debugPrint('خطأ في التسجيل: $e');
              }
            }

            void _updateRecording(DragUpdateDetails details) {
              if (!_isRecordingActive) return;
              setState(() {
                _currentDragY += details.delta.dy;
                if (_currentDragY < -40) {
                  _isLocked = true;
                }
              });
            }

            Future<void> _endRecording() async {
              if (!_isRecordingActive) return;
              if (_isLocked) return;
              
              final path = await _audioRecorder.stop();
              setState(() {
                _isRecordingActive = false;
                _isLocked = false;
                _currentDragY = 0.0;
                if (path != null) {
                  _messages.add({
                    'type': 'voice',
                    'content': path,
                    'time': '8:35 م',
                    'isMe': 'true'
                  });
                }
              });
            }

            Future<void> _cancelRecording() async {
              await _audioRecorder.stop();
              setState(() {
                _isRecordingActive = false;
                _isLocked = false;
                _currentDragY = 0.0;
              });
            }

            Future<void> _playVoice(String path) async {
              if (path.isNotEmpty) {
                Source urlSource = DeviceFileSource(path);
                await _audioPlayer.play(urlSource);
              }
            }

