name: Build Flutter APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
      - name: Create fresh android files
        run: flutter create . --org com.example --project-name zajel_app --platforms=android
      - name: Disable R8 and fix config
        run: |
          PROP_FILE="android/gradle.properties"
          echo "android.enableR8=false" >> "$PROP_FILE"
          echo "android.enableR8.libraries=false" >> "$PROP_FILE"
          
          BUILD_FILE="android/app/build.gradle"
          if [ -f "$BUILD_FILE" ]; then
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/g' "$BUILD_FILE"
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/g' "$BUILD_FILE"
          fi
      - run: flutter pub get
      - run: flutter build apk --release --no-shrink --no-tree-shake-icons
