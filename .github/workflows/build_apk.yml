              _audioPlayer = AudioPlayer();
              _textController.addListener(() {
                _isTypingNotifier.value = _textController.text.trim().isNotEmpty;
              });
              _messages.add({
                'type': 'text',
                'content': 'أهلاً بك! معك ${widget.userName} 🕊',
                'time': '8:28 م',
                'isMe': 'false'
              });
