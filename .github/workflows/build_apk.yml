name: Build Flutter APK

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          cache: true

      - name: Create Clean Flutter Project
        run: |
          flutter create . --org com.zajel --project-name zajel --platforms=android

      - name: Fix Kotlin and Gradle Versions Properly
        run: |
          SETTINGS_FILE="android/settings.gradle"
          if [ -f "$SETTINGS_FILE" ]; then
            sed -i 's/kotlin_version = .*/kotlin_version = "1.9.24"/g' "$SETTINGS_FILE"
            if ! grep -q "kotlin_version" "$SETTINGS_FILE"; then
              sed -i '1i plugins { id "dev.flutter.flutter-plugin-loader" version "1.0.0"; id "com.android.application" version "7.3.0" apply false; id "org.jetbrains.kotlin.android" version "1.9.24" apply false }' "$SETTINGS_FILE"
            fi
          fi

          APP_BUILD_FILE="android/app/build.gradle"
          if [ -f "$APP_BUILD_FILE" ]; then
            sed -i 's/minSdkVersion.*/minSdkVersion 23/g' "$APP_BUILD_FILE"
            sed -i 's/minSdk =.*/minSdk = 23/g' "$APP_BUILD_FILE"
            if ! grep -q "multiDexEnabled" "$APP_BUILD_FILE"; then
              sed -i '/defaultConfig {/a \        multiDexEnabled true' "$APP_BUILD_FILE"
            fi
          fi

      - name: Inject Full Modern Zajel App Code with All Features Restored
        run: |
          cat << 'EOF' > pubspec.yaml
          name: zajel
          description: "A new Flutter project."
          publish_to: 'none'
          version: 1.0.0+1

          environment:
            sdk: '>=3.0.0 <4.0.0'

          dependencies:
            flutter:
              sdk: flutter
            image_picker: ^1.0.7
            record: ^5.1.2
            audioplayers: ^6.0.0

          dev_dependencies:
            flutter_test:
              sdk: flutter
            flutter_lints: ^3.0.0

          flutter:
            uses-material-design: true
          EOF

          cat << 'EOF' > lib/main.dart
          import 'dart:io';
          import 'package:flutter/material.dart';
          import 'package:image_picker/image_picker.dart';
          import 'package:record/record.dart';
          import 'package:audioplayers/audioplayers.dart';

          void main() {
            runApp(const ZajelApp());
          }

          Route<T> _smoothRoute<T>(Widget page) {
            return PageRouteBuilder<T>(
              pageBuilder: (context, animation, secondaryAnimation) => page,
              transitionsBuilder: (context, animation, secondaryAnimation, child) {
                const begin = Offset(0.08, 0.0);
                const end = Offset.zero;
                const curve = Curves.fastOutSlowIn;
                
                var slideTween = Tween(begin: begin, end: end).chain(CurveTween(curve: curve));
                var fadeTween = Tween<double>(begin: 0.0, end: 1.0).chain(CurveTween(curve: const Interval(0.0, 0.7, curve: Curves.easeOut)));

                return FadeTransition(
                  opacity: animation.drive(fadeTween),
                  child: SlideTransition(
                    position: animation.drive(slideTween),
                    child: child,
                  ),
                );
              },
              transitionDuration: const Duration(milliseconds: 240),
              reverseTransitionDuration: const Duration(milliseconds: 200),
            );
          }

          class ThemeNotifier extends ValueNotifier<bool> {
            ThemeNotifier() : super(true);

            void toggleTheme(bool isDark) {
              value = isDark;
            }
          }

          final themeNotifier = ThemeNotifier();

          class ZajelApp extends StatelessWidget {
            const ZajelApp({super.key});

            @override
            Widget build(BuildContext context) {
              return ValueListenableBuilder<bool>(
                valueListenable: themeNotifier,
                builder: (context, isDark, child) {
                  return MaterialApp(
                    debugShowCheckedModeBanner: false,
                    title: 'زاجل - Zajel',
                    theme: ThemeData(
                      primarySwatch: Colors.deepPurple,
                      scaffoldBackgroundColor: isDark ? const Color(0xFF0F0C15) : Colors.white,
                      useMaterial3: true,
                    ),
                    home: const LoginScreen(),
                  );
                },
              );
            }
          }

          class LoginScreen extends StatefulWidget {
            const LoginScreen({super.key});

            @override
            State<LoginScreen> createState() => _LoginScreenState();
          }

          class _LoginScreenState extends State<LoginScreen> {
            final _phoneController = TextEditingController();

            void _sendCode() {
              Navigator.push(
                context,
                _smoothRoute(OtpVerificationScreen(phoneNumber: _phoneController.text)),
              );
            }

            @override
            Widget build(BuildContext context) {
              return ValueListenableBuilder<bool>(
                valueListenable: themeNotifier,
                builder: (context, isDark, child) {
                  return Scaffold(
                    backgroundColor: isDark ? const Color(0xFF0F0C15) : Colors.white,
                    body: Padding(
                      padding: const EdgeInsets.symmetric(horizontal: 28.0),
                      child: Center(
                        child: SingleChildScrollView(
                          child: Column(
                            mainAxisAlignment: MainAxisAlignment.center,
                            children: [
                              Container(
                                padding: const EdgeInsets.all(22),
                                decoration: BoxDecoration(
                                  color: isDark ? const Color(0xFF221A30) : Colors.blue.shade50,
                                  shape: BoxShape.circle,
                                  boxShadow: [
                                    BoxShadow(
                                      color: isDark ? Colors.purpleAccent.withOpacity(0.15) : Colors.blue.withOpacity(0.1),
                                      blurRadius: 25,
                                      offset: const Offset(0, 8),
                                    ),
                                  ],
                                ),
                                child: const Text('🕊️', style: TextStyle(fontSize: 48)),
                              ),
                              const SizedBox(height: 24),
                              Text(
                                'زاجل | Zajel',
                                style: TextStyle(
                                  fontSize: 32,
                                  fontWeight: FontWeight.bold,
                                  color: isDark ? const Color(0xFFEADBFF) : Colors.blue.shade900,
                                  letterSpacing: 1.2,
                                ),
                              ),
                              const SizedBox(height: 8),
                              Text(
                                'التواصل الأسرع والأكثر أماناً',
                                style: TextStyle(color: isDark ? Colors.grey.shade400 : Colors.grey.shade600, fontSize: 13, letterSpacing: 0.5),
                              ),
                              const SizedBox(height: 48),
                              Container(
                                padding: const EdgeInsets.symmetric(horizontal: 16, vertical: 6),
                                decoration: BoxDecoration(
                                  color: isDark ? const Color(0xFF191324) : Colors.grey.shade100,
                                  borderRadius: BorderRadius.circular(20),
                                  border: Border.all(color: isDark ? Colors.deepPurple.withOpacity(0.3) : Colors.blue.shade200),
                                ),
                                child: TextField(
                                  controller: _phoneController,
                                  keyboardType: TextInputType.phone,
                                  style: TextStyle(fontSize: 16, color: isDark ? Colors.white : Colors.black87, letterSpacing: 1),
                                  decoration: InputDecoration(
                                    border: InputBorder.none,
                                    labelText: 'رقم الهاتف',
                                    labelStyle: TextStyle(color: isDark ? const Color(0xFFC79FFF) : Colors.blue.shade700, fontSize: 14),
                                    hintText: '+964 770 000 0000',
                                    hintStyle: TextStyle(color: Colors.grey.shade500, fontSize: 13),
                                    prefixIcon: Icon(Icons.phone_iphone_rounded, color: isDark ? const Color(0xFFC79FFF) : Colors.blue.shade700, size: 20),
                                  ),
                                ),
                              ),
                              const SizedBox(height: 36),
                              Container(
                                width: double.infinity,
                                height: 54,
                                decoration: BoxDecoration(
                                  borderRadius: BorderRadius.circular(20),
                                  gradient: isDark
                                      ? const LinearGradient(colors: [Color(0xFF6F35B4), Color(0xFF4A1E85)])
                                      : null,
                                  color: isDark ? null : Colors.blue,
                                  boxShadow: [
                                    BoxShadow(
                                      color: (isDark ? Colors.purple : Colors.blue).withOpacity(0.3),
                                      blurRadius: 12,
                                      offset: const Offset(0, 5),
                                    ),
                                  ],
                                ),
                                child: ElevatedButton(
                                  style: ElevatedButton.styleFrom(
                                    backgroundColor: Colors.transparent,
                                    shadowColor: Colors.transparent,
                                    shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(20)),
                                  ),
                                  onPressed: _sendCode,
                                  child: const Row(
                                    mainAxisAlignment: MainAxisAlignment.center,
                                    children: [
                                      Text(
                                        'إرسال رمز التحقق',
                                        style: TextStyle(color: Colors.white, fontSize: 16, fontWeight: FontWeight.bold),
                                      ),
                                      SizedBox(width: 8),
                                      Icon(Icons.arrow_forward_rounded, size: 18, color: Colors.white),
                                    ],
                                  ),
                                ),
                              ),
                            ],
                          ),
                        ),
                      ),
                    ),
                  );
                },
              );
            }
          }

          class OtpVerificationScreen extends StatefulWidget {
            final String phoneNumber;
            const OtpVerificationScreen({super.key, required this.phoneNumber});

            @override
            State<OtpVerificationScreen> createState() => _OtpVerificationScreenState();
          }

          class _OtpVerificationScreenState extends State<OtpVerificationScreen> {
            final List<TextEditingController> _controllers = List.generate(6, (_) => TextEditingController());

            void _verifyAndProceed() {
              Navigator.pushAndRemoveUntil(
                context,
                _smoothRoute(const ChatListScreen()),
                (route) => false,
              );
            }

            @override
            Widget build(BuildContext context) {
              return ValueListenableBuilder<bool>(
                valueListenable: themeNotifier,
                builder: (context, isDark, child) {
                  return Scaffold(
                    backgroundColor: isDark ? const Color(0xFF0F0C15) : Colors.white,
                    appBar: AppBar(
                      backgroundColor: isDark ? const Color(0xFF161022) : Colors.blue.shade50,
                      title: Text('رمز التحقق', style: TextStyle(color: isDark ? Colors.white : Colors.black87, fontSize: 16)),
                      leading: IconButton(
                        icon: Icon(Icons.arrow_back_ios_new_rounded, color: isDark ? Colors.white : Colors.black87, size: 18),
                        onPressed: () => Navigator.pop(context),
                      ),
                      elevation: 0,
                    ),
                    body: Padding(
                      padding: const EdgeInsets.all(24.0),
                      child: Column(
                        mainAxisAlignment: MainAxisAlignment.center,
                        children: [
                          Text(
                            'أدخل رمز التحقق المرسل',
                            style: TextStyle(fontSize: 20, fontWeight: FontWeight.bold, color: isDark ? const Color(0xFFEADBFF) : Colors.blue.shade900),
                          ),
                          const SizedBox(height: 8),
                          Text(
                            'إلى الرقم: ${widget.phoneNumber.isEmpty ? "رقمك الشخصي" : widget.phoneNumber}',
                            style: TextStyle(color: Colors.grey.shade500, fontSize: 13),
                          ),
                          const SizedBox(height: 36),
                          Row(
                            mainAxisAlignment: MainAxisAlignment.spaceEvenly,
                            children: List.generate(6, (index) {
                              return Container(
                                width: 45,
                                height: 52,
                                decoration: BoxDecoration(
                                  color: isDark ? const Color(0xFF191324) : Colors.grey.shade100,
                                  borderRadius: BorderRadius.circular(14),
                                  border: Border.all(color: isDark ? Colors.deepPurple.shade700 : Colors.blue, width: 1.5),
                                ),
                                child: TextField(
                                  controller: _controllers[index],
                                  keyboardType: TextInputType.number,
                                  textAlign: TextAlign.center,
                                  maxLength: 1,
                                  style: TextStyle(fontSize: 18, fontWeight: FontWeight.bold, color: isDark ? Colors.white : Colors.black87),
                                  decoration: const InputDecoration(counterText: '', border: InputBorder.none),
                                  onChanged: (value) {
                                    if (value.isNotEmpty && index < 5) {
                                      FocusScope.of(context).nextFocus();
                                    }
                                  },
                                ),
                              );
                            }),
                          ),
                          const SizedBox(height: 40),
                          Container(
                            width: double.infinity,
                            height: 52,
                            decoration: BoxDecoration(
                              borderRadius: BorderRadius.circular(20),
                              gradient: isDark ? const LinearGradient(colors: [Color(0xFF6F35B4), Color(0xFF4A1E85)]) : null,
                              color: isDark ? null : Colors.blue,
                            ),
                            child: ElevatedButton(
                              style: ElevatedButton.styleFrom(
                                backgroundColor: Colors.transparent,
                                shadowColor: Colors.transparent,
                                shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(20)),
                              ),
                              onPressed: _verifyAndProceed,
                              child: const Text('تأكيد والانتقال', style: TextStyle(color: Colors.white, fontSize: 16, fontWeight: FontWeight.bold)),
                            ),
                          ),
                        ],
                      ),
                    ),
                  );
                },
              );
            }
          }

          class ProfileScreen extends StatefulWidget {
            const ProfileScreen({super.key});

            @override
            State<ProfileScreen> createState() => _ProfileScreenState();
          }

          class _ProfileScreenState extends State<ProfileScreen> {
            String _profileStatus = 'صورة احترافية نشطة';

            @override
            Widget build(BuildContext context) {
              return ValueListenableBuilder<bool>(
                valueListenable: themeNotifier,
                builder: (context, isDark, child) {
                  return Scaffold(
                    backgroundColor: isDark ? const Color(0xFF0F0C15) : Colors.white,
                    appBar: AppBar(
                      backgroundColor: isDark ? const Color(0xFF161022) : Colors.blue.shade50,
                      elevation: 0,
                      leading: IconButton(
                        icon: Icon(Icons.arrow_back_ios_new_rounded, color: isDark ? Colors.white : Colors.black87, size: 18),
                        onPressed: () => Navigator.pop(context),
                      ),
                      title: Text('الملف الشخصي', style: TextStyle(color: isDark ? Colors.white : Colors.black87, fontSize: 16)),
                    ),
                    body: SingleChildScrollView(
                      child: Column(
                        children: [
                          const SizedBox(height: 28),
                          Center(
                            child: CircleAvatar(
                              radius: 54,
                              backgroundColor: isDark ? const Color(0xFF191324) : Colors.grey.shade100,
                              child: Icon(Icons.person, size: 68, color: isDark ? const Color(0xFFEADBFF) : Colors.blue),
                            ),
                          ),
                          const SizedBox(height: 12),
                          Text(_profileStatus, style: TextStyle(fontSize: 12, color: isDark ? const Color(0xFFC79FFF) : Colors.blue.shade700, fontWeight: FontWeight.w500)),
                          const SizedBox(height: 28),
                          Padding(
                            padding: const EdgeInsets.symmetric(horizontal: 16.0),
                            child: Column(
                              children: [
                                _buildCard(isDark, Icons.person_outline_rounded, 'الاسم الكامل', 'مستخدم زاجل'),
                                const SizedBox(height: 12),
                                _buildCard(isDark, Icons.phone_android_rounded, 'رقم الهاتف', '+964 770 000 0000'),
                                const SizedBox(height: 12),
                                _buildCard(isDark, Icons.info_outline_rounded, 'الحالة الشخصية', 'متاح للتواصل الفوري 🕊'),
                              ],
                            ),
                          ),
                        ],
                      ),
                    ),
                  );
                },
              );
            }

            Widget _buildCard(bool isDark, IconData icon, String title, String value) {
              return Container(
                decoration: BoxDecoration(
                  color: isDark ? const Color(0xFF161022) : Colors.grey.shade50,
                  borderRadius: BorderRadius.circular(16),
                  border: Border.all(color: isDark ? Colors.white.withOpacity(0.04) : Colors.blue.shade100),
                ),
                child: ListTile(
                  leading: Container(
                    padding: const EdgeInsets.all(10),
                    decoration: BoxDecoration(color: isDark ? const Color(0xFF221A30) : Colors.blue.shade100, borderRadius: BorderRadius.circular(12)),
                    child: Icon(icon, color: isDark ? const Color(0xFFEADBFF) : Colors.blue, size: 20),
                  ),
                  title: Text(title, style: TextStyle(fontSize: 11, color: isDark ? Colors.grey.shade400 : Colors.grey.shade600)),
                  subtitle: Text(value, style: TextStyle(fontSize: 14, fontWeight: FontWeight.bold, color: isDark ? Colors.white : Colors.black87)),
                ),
              );
            }
          }

          class SettingsScreen extends StatelessWidget {
            const SettingsScreen({super.key});

            @override
            Widget build(BuildContext context) {
              return ValueListenableBuilder<bool>(
                valueListenable: themeNotifier,
                builder: (context, isDark, child) {
                  return Scaffold(
                    backgroundColor: isDark ? const Color(0xFF0F0C15) : Colors.white,
                    appBar: AppBar(
                      backgroundColor: isDark ? const Color(0xFF161022) : Colors.blue.shade50,
                      elevation: 0,
                      leading: IconButton(
                        icon: Icon(Icons.arrow_back_ios_new_rounded, color: isDark ? Colors.white : Colors.black87, size: 18),
                        onPressed: () => Navigator.pop(context),
                      ),
                      title: Text('الإعدادات', style: TextStyle(color: isDark ? Colors.white : Colors.black87, fontSize: 16)),
                    ),
                    body: Padding(
                      padding: const EdgeInsets.all(20.0),
                      child: Column(
                        crossAxisAlignment: CrossAxisAlignment.start,
                        children: [
                          Text('إعدادات المظهر', style: TextStyle(fontSize: 14, fontWeight: FontWeight.bold, color: isDark ? const Color(0xFFC79FFF) : Colors.blue)),
                          const SizedBox(height: 16),
                          Container(
                            decoration: BoxDecoration(
                              color: isDark ? const Color(0xFF161022) : Colors.grey.shade50,
                              borderRadius: BorderRadius.circular(16),
                              border: Border.all(color: isDark ? Colors.white.withOpacity(0.04) : Colors.blue.shade100),
                            ),
                            child: SwitchListTile(
                              secondary: Icon(isDark ? Icons.nights_stay_rounded : Icons.wb_sunny_rounded, color: isDark ? Colors.amberAccent : Colors.orange),
                              title: Text(isDark ? 'الوضع الداكن' : 'الوضع الفاتح', style: TextStyle(color: isDark ? Colors.white : Colors.black87, fontWeight: FontWeight.bold, fontSize: 14)),
                              value: isDark,
                              activeColor: Colors.blue,
                              onChanged: (val) => themeNotifier.toggleTheme(val),
                            ),
                          ),
                        ],
                      ),
                    ),
                  );
                },
              );
            }
          }

          class ChatListScreen extends StatefulWidget {
            const ChatListScreen({super.key});

            @override
            State<ChatListScreen> createState() => _ChatListScreenState();
          }

          class _ChatListScreenState extends State<ChatListScreen> {
            final List<Map<String, dynamic>> _chats = [
              {'name': 'أحمد علي', 'lastMessage': 'أهلاً بك! كيف حالك اليوم؟', 'time': '10:30 ص', 'unread': 2, 'isOnline': true, 'color': const Color(0xFFC79FFF)},
              {'name': 'فريق زاجل', 'lastMessage': 'مرحباً بك في تطبيق زاجل 🕊', 'time': 'أمس', 'unread': 0, 'isOnline': true, 'color': const Color(0xFF8A49DF)},
            ];

            @override
            Widget build(BuildContext context) {
              return ValueListenableBuilder<bool>(
                valueListenable: themeNotifier,
                builder: (context, isDark, child) {
                  return Scaffold(
                    backgroundColor: isDark ? const Color(0xFF0F0C15) : Colors.white,
                    appBar: AppBar(
                      backgroundColor: isDark ? const Color(0xFF161022) : Colors.blue.shade50,
                      elevation: 0,
                      title: Text('المحادثات | Zajel', style: TextStyle(color: isDark ? Colors.white : Colors.black87, fontWeight: FontWeight.bold, fontSize: 18)),
                      actions: [
                        PopupMenuButton<String>(
                          color: isDark ? const Color(0xFF161022) : Colors.white,
                          icon: Icon(Icons.more_vert_rounded, color: isDark ? Colors.white : Colors.black87, size: 20),
                          onSelected: (val) {
                            if (val == 'profile') Navigator.push(context, _smoothRoute(const ProfileScreen()));
                            if (val == 'settings') Navigator.push(context, _smoothRoute(const SettingsScreen()));
                            if (val == 'logout') Navigator.pushReplacement(context, _smoothRoute(const LoginScreen()));
                          },
                          itemBuilder: (context) => [
                            const PopupMenuItem(value: 'profile', child: Text('الملف الشخصي')),
                            const PopupMenuItem(value: 'settings', child: Text('الإعدادات')),
                            const PopupMenuItem(value: 'logout', child: Text('تسجيل الخروج', style: TextStyle(color: Colors.redAccent))),
                          ],
                        ),
                      ],
                    ),
                    body: ListView.builder(
                      itemCount: _chats.length,
                      padding: const EdgeInsets.all(12),
                      itemBuilder: (context, index) {
                        final chat = _chats[index];
                        return Container(
                          margin: const EdgeInsets.only(bottom: 8),
                          decoration: BoxDecoration(
                            color: isDark ? const Color(0xFF161022) : Colors.white,
                            borderRadius: BorderRadius.circular(16),
                            border: Border.all(color: isDark ? Colors.transparent : Colors.blue.shade100),
                          ),
                          child: ListTile(
                            leading: CircleAvatar(
                              backgroundColor: (chat['color'] as Color).withOpacity(0.2),
                              child: Text(chat['name'][0], style: TextStyle(color: chat['color'], fontWeight: FontWeight.bold)),
                            ),
                            title: Text(chat['name'], style: TextStyle(fontWeight: FontWeight.bold, color: isDark ? Colors.white : Colors.black87)),
                            subtitle: Text(chat['lastMessage'], style: TextStyle(color: Colors.grey.shade500, fontSize: 12)),
                            onTap: () => Navigator.push(context, _smoothRoute(ChatScreen(userName: chat['name']))),
                          ),
                        );
                      },
                    ),
                  );
                },
              );
            }
          }

          class ChatScreen extends StatefulWidget {
            final String userName;
            const ChatScreen({super.key, required this.userName});

            @override
            State<ChatScreen> createState() => _ChatScreenState();
          }

          class _ChatScreenState extends State<ChatScreen> {
            final _textController = TextEditingController();
            final List<Map<String, dynamic>> _messages = [];
            final ImagePicker _picker = ImagePicker();
            late final AudioRecorder _audioRecorder;
            late final AudioPlayer _audioPlayer;
            bool _isRecording = false;

            @override
            void initState() {
              super.initState();
              _audioRecorder = AudioRecorder();
              _audioPlayer = AudioPlayer();
              _messages.add({'type': 'text', 'content': 'أهلاً بك! معك ${widget.userName} 🕊', 'time': '8:28 م', 'isMe': false});
            }

            @override
            void dispose() {
              _textController.dispose();
              _audioRecorder.dispose();
              _audioPlayer.dispose();
              super.dispose();
            }

            void _sendMessage() {
              if (_textController.text.trim().isEmpty) return;
              setState(() {
                _messages.add({'type': 'text', 'content': _textController.text, 'time': '8:29 م', 'isMe': true});
              });
              _textController.clear();
            }

            Future<void> _pickImage() async {
              final XFile? image = await _picker.pickImage(source: ImageSource.gallery);
              if (image != null) {
                setState(() {
                  _messages.add({'type': 'image', 'content': image.path, 'time': '8:30 م', 'isMe': true});
                });
              }
            }

            Future<void> _startRecording() async {
              if (await _audioRecorder.hasPermission()) {
                await _audioRecorder.start(const RecordConfig(encoder: AudioEncoder.aacLc), path: '');
                setState(() => _isRecording = true);
              }
            }

            Future<void> _stopRecording() async {
              final path = await _audioRecorder.stop();
              setState(() => _isRecording = false);
              if (path != null) {
                setState(() {
                  _messages.add({'type': 'voice', 'content': path, 'time': '8:35 م', 'isMe': true});
                });
              }
            }

            Future<void> _playVoice(String path) async {
              if (path.isNotEmpty) {
                await _audioPlayer.play(DeviceFileSource(path));
              }
            }

            @override
            Widget build(BuildContext context) {
              return ValueListenableBuilder<bool>(
                valueListenable: themeNotifier,
                builder: (context, isDark, child) {
                  return Scaffold(
                    backgroundColor: isDark ? const Color(0xFF0F0C15) : Colors.white,
                    appBar: AppBar(
                      backgroundColor: isDark ? const Color(0xFF161022) : Colors.blue.shade50,
                      elevation: 0,
                      title: Text(widget.userName, style: TextStyle(color: isDark ? Colors.white : Colors.black87, fontSize: 16)),
                      leading: IconButton(icon: Icon(Icons.arrow_back_ios_new_rounded, color: isDark ? Colors.white : Colors.black87), onPressed: () => Navigator.pop(context)),
                    ),
                    body: Column(
                      children: [
                        Expanded(
                          child: ListView.builder(
                            padding: const EdgeInsets.all(12),
                            itemCount: _messages.length,
                            itemBuilder: (context, index) {
                              final msg = _messages[index];
                              final isMe = msg['isMe'] == true;
                              return Align(
                                alignment: isMe ? Alignment.centerRight : Alignment.centerLeft,
                                child: Container(
                                  margin: const EdgeInsets.symmetric(vertical: 4),
                                  padding: const EdgeInsets.all(12),
                                  decoration: BoxDecoration(
                                    color: isMe ? (isDark ? const Color(0xFF4A1E85) : Colors.blue) : (isDark ? const Color(0xFF1E172B) : Colors.grey.shade100),
                                    borderRadius: BorderRadius.circular(14),
                                  ),
                                  child: msg['type'] == 'voice'
                                      ? Row(
                                          mainAxisSize: MainAxisSize.min,
                                          children: [
                                            IconButton(icon: const Icon(Icons.play_arrow, color: Colors.white), onPressed: () => _playVoice(msg['content'])),
                                            const Text('رسالة صوتية 🎤', style: TextStyle(color: Colors.white)),
                                          ],
                                        )
                                      : msg['type'] == 'image'
                                          ? ClipRRect(borderRadius: BorderRadius.circular(8), child: Image.file(File(msg['content']), width: 150, height: 150, fit: BoxFit.cover))
                                          : Text(msg['content'], style: TextStyle(color: isMe ? Colors.white : (isDark ? Colors.white : Colors.black87))),
                                ),
                              );
                            },
                          ),
                        ),
                        Padding(
                          padding: const EdgeInsets.all(8.0),
                          child: Row(
                            children: [
                              IconButton(icon: Icon(Icons.image, color: isDark ? const Color(0xFFC79FFF) : Colors.blue), onPressed: _pickImage),
                              Expanded(
                                child: TextField(
                                  controller: _textController,
                                  style: TextStyle(color: isDark ? Colors.white : Colors.black87),
                                  decoration: InputDecoration(
                                    hintText: 'اكتب رسالة...',
                                    hintStyle: TextStyle(color: Colors.grey.shade500),
                                    border: InputBorder.none,
                                  ),
                                ),
                              ),
                              IconButton(
                                icon: Icon(_isRecording ? Icons.stop : Icons.mic, color: _isRecording ? Colors.red : (isDark ? const Color(0xFFC79FFF) : Colors.blue)),
                                onPressed: _isRecording ? _stopRecording : _startRecording,
                              ),
                              IconButton(icon: const Icon(Icons.send, color: Colors.blue), onPressed: _sendMessage),
                            ],
                          ),
                        ),
                      ],
                    ),
                  );
                },
              );
            }
          }
          EOF

      - name: Build APK (No Shrink)
        run: flutter build apk --release --no-shrink

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zajel-apk
          path: build/app/outputs/flutter-apk/app-release.apk
