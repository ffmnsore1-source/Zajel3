name: Build Flutter APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
      - name: Create fresh android files
        run: flutter create . --org com.example --project-name zajel_app --platforms=android
      - run: flutter pub get
      - run: flutter build apk --release
