name: Build Zajel APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter Version
        run: flutter --version

      - name: Check Project Files
        run: |
          echo "Checking Android project files..."
          ls -la
          ls -la android || true
          ls -la android/app || true

      - name: Restore Android Project
        run: |
          flutter create --platforms=android --org com.example .
          echo "Android project files after restoration:"
          ls -la android
          ls -la android/app

      - name: Get Dependencies
        run: flutter pub get

      - name: Check Dependencies
        run: flutter pub deps

      - name: Build APK
        run: flutter build apk --release -v

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: zajel-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7
