 
name: Build Zajel APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Show project files
        run: |
          echo "===== ROOT ====="
          ls -la
          echo "===== ANDROID ====="
          ls -la android || true
          echo "===== ANDROID APP ====="
          ls -la android/app || true

      - name: Restore Android scaffolding if missing
        run: |
          if [ ! -f android/settings.gradle ] && [ ! -f android/settings.gradle.kts ]; then
            flutter create --platforms=android --org com.example .
          fi

      - name: Remove duplicate Kotlin MainActivity
        run: |
          if [ -f android/app/src/main/java/com/example/zajel/MainActivity.java ]; then
            if [ -d android/app/src/main/kotlin ]; then
              find android/app/src/main/kotlin -type f -name "MainActivity.kt" -print -delete
            fi
          fi

      - name: Verify MainActivity files
        run: |
          echo "===== JAVA ====="
          find android/app/src/main/java -type f -name "MainActivity.java" -print || true
          echo "===== KOTLIN ====="
          find android/app/src/main/kotlin -type f -name "MainActivity.kt" -print || true

      - name: Get dependencies
        run: flutter pub get

      - name: Create Android signing key
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build APK and save full log
        run: |
          set -o pipefail
          flutter build apk --release -v 2>&1 | tee build_log.txt

      - name: Upload diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zajel-build-diagnostic
          path: build_log.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Sign and verify APK
        run: |
          set -euo pipefail

          APK="build/app/outputs/flutter-apk/app-release.apk"
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/Android/Sdk}}"

          test -f "$APK"

          BT="$(find "$SDK/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"

          test -x "$BT/apksigner"
          test -x "$BT/zipalign"
          test -x "$BT/aapt"

          echo "===== APK ZIP CHECK ====="
          unzip -t "$APK"

          echo "===== PACKAGE INFORMATION ====="
          "$BT/aapt" dump badging "$APK" | head -n 5

          "$BT/aapt" dump badging "$APK" | grep -q "package: name='com.example.zajel'"

          echo "===== ZIP ALIGN ====="
          "$BT/zipalign" -f -p 4 "$APK" app-aligned.apk

          echo "===== SIGN APK ====="
          "$BT/apksigner" sign \
            --ks "$HOME/.android/debug.keystore" \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out app-release-signed.apk \
            app-aligned.apk

          echo "===== VERIFY APK SIGNATURE ====="
          "$BT/apksigner" verify --verbose --print-certs app-release-signed.apk

          cp app-release-signed.apk "$APK"

          echo "===== FINAL APK ====="
          ls -lh "$APK"
          sha256sum "$APK"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: zajel-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7
