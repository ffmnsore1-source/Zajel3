name: Build Flutter APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
      
      - name: Automatic Project Generation & Build
        run: |
          # الاحتفاظ بنسخة من كود برمجياتك (ملفات الـ lib و pubspec)
          mkdir -p temp_backup
          if [ -d "lib" ]; then cp -r lib temp_backup/; fi
          if [ -f "pubspec.yaml" ]; then cp pubspec.yaml temp_backup/; fi
          
          # توليد مشروع فلاتر كامل ونظيف يدعم أحدث إصدارات الأندرويد والكوتلن
          flutter create . --org com.example --project-name zajel_app --platforms=android
          
          # استعادة الكود الخاص بك داخل المشروع الجديد
          if [ -d "temp_backup/lib" ]; then rm -rf lib/* && cp -r temp_backup/lib/* lib/; fi
          if [ -f "temp_backup/pubspec.yaml" ]; then cp temp_backup/pubspec.yaml ./; fi
          
          # ضبط الحد الأدنى لإصدار الأندرويد (minSdk 23)
          BUILD_FILE="android/app/build.gradle"
          if [ -f "$BUILD_FILE" ]; then
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/g' "$BUILD_FILE"
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/g' "$BUILD_FILE"
          fi

      - run: flutter pub get
      - run: flutter build apk --release --no-shrink --no-tree-shake-icons
