name: Build Zajel APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter Version
        run: flutter --version

      - name: Check Project Files
        run: |
          echo "===== PROJECT ROOT ====="
          ls -la
          echo "===== ANDROID DIRECTORY ====="
          ls -la android || true
          echo "===== ANDROID APP DIRECTORY ====="
          ls -la android/app || true

      - name: Restore Android Project
        run: |
          flutter create --platforms=android --org com.example .
          echo "===== RESTORED ANDROID FILES ====="
          ls -la android
          ls -la android/app

      - name: Get Dependencies
        run: flutter pub get

      - name: Check Dependencies
        run: flutter pub deps

      - name: Build APK
        run: |
          set -o pipefail
          flutter build apk --release -v 2>&1 | tee build_log.txt

      - name: Show Error Summary
        if: failure()
        run: |
          echo "===== BUILD ERROR SUMMARY ====="
          if [ -f build_log.txt ]; then
            grep -n -i -E \
              "error:|exception:|failed|v1 embedding|requires a higher|what went wrong" \
              build_log.txt | tail -40 || true
          else
            echo "Build log does not exist."
            echo "Check the failed step above."
          fi

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zajel-build-log
          path: build_log.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: zajel-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7
