name: Build Flutter APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'
      
      - name: Generate Project and Build APK
        run: |
          # 1. الاحتفاظ بنسخة آمنة من كود التطبيق الخاص بك
          mkdir -p my_backup
          if [ -d "lib" ]; then cp -r lib my_backup/; fi
          if [ -f "pubspec.yaml" ]; then cp pubspec.yaml my_backup/; fi
          
          # 2. إنشاء هيكل أندرويد نظيف ومتوافق
          flutter create . --org com.example --project-name zajel_app --platforms=android
          
          # 3. استعادة كود التطبيق الخاص بك بدقة
          if [ -d "my_backup/lib" ]; then rm -rf lib/* && cp -r my_backup/lib/* lib/; fi
          if [ -f "my_backup/pubspec.yaml" ]; then cp "my_backup/pubspec.yaml" ./; fi
          
          # 4. رفع الحد الأدنى لإصدار الأندرويد ليكون 23 وتفعيل الـ MultiDex
          BUILD_FILE="android/app/build.gradle"
          if [ -f "$BUILD_FILE" ]; then
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/g' "$BUILD_FILE"
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/g' "$BUILD_FILE"
            
            # تعطيل الـ minify والـ shrinkResources جذرياً لمنع أخطاء الـ Shrinker نهائياً
            sed -i 's/minifyEnabled true/minifyEnabled false/g' "$BUILD_FILE"
            sed -i 's/shrinkResources true/shrinkResources false/g' "$BUILD_FILE"
            
            # إضافة تفعيل الـ MultiDex لمنع أي خطأ تجميعي
            sed -i '/defaultConfig {/a \    multiDexEnabled true' "$BUILD_FILE"
          fi
          
          # 5. ضبط ملف الـ build.gradle الرئيسي وإصدار الكوتلن الثابت والمستقر (1.8.22)
          PROJECT_BUILD_FILE="android/build.gradle"
          echo "buildscript {" > "$PROJECT_BUILD_FILE"
          echo "    ext.kotlin_version = '1.8.22'" >> "$PROJECT_BUILD_FILE"
          echo "    repositories {" >> "$PROJECT_BUILD_FILE"
          echo "        google()" >> "$PROJECT_BUILD_FILE"
          echo "        mavenCentral()" >> "$PROJECT_BUILD_FILE"
          echo "    }" >> "$PROJECT_BUILD_FILE"
          echo "    dependencies {" >> "$PROJECT_BUILD_FILE"
          echo "        classpath 'com.android.tools.build:gradle:7.4.2'" >> "$PROJECT_BUILD_FILE"
          echo "        classpath \"org.jetbrains.kotlin:kotlin-gradle-plugin:\$kotlin_version\"" >> "$PROJECT_BUILD_FILE"
          echo "    }" >> "$PROJECT_BUILD_FILE"
          echo "}" >> "$PROJECT_BUILD_FILE"
          echo "" >> "$PROJECT_BUILD_FILE"
          echo "allprojects {" >> "$PROJECT_BUILD_FILE"
          echo "    repositories {" >> "$PROJECT_BUILD_FILE"
          echo "        google()" >> "$PROJECT_BUILD_FILE"
          echo "        mavenCentral()" >> "$PROJECT_BUILD_FILE"
          echo "    }" >> "$PROJECT_BUILD_FILE"
          echo "}" >> "$PROJECT_BUILD_FILE"

      - run: flutter pub get
      - run: flutter build apk --release --no-shrink --no-tree-shake-icons
