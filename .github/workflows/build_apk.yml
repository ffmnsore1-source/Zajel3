name: Build Flutter APK

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.x'
          channel: 'stable'
          cache: true

      - name: Auto-Fix and Generate Android Scaffolding
        run: |
          # إذا كان مجلد الأندرويد غير موجود أو ناقص، سيقوم النظام بإنشائه كاملاً وسليماً 100% تلقائياً
          if [ ! -f "android/app/src/main/AndroidManifest.xml" ]; then
            echo "Android files missing or incomplete. Generating fresh Android structure..."
            rm -rf android
            flutter create . --org com.zajel.app --project-name zajel --platforms=android
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
