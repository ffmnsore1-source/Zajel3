name: Build Flutter APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
      
      - name: Clean Build and Fix
        run: |
          mkdir -p backup_files
          if [ -d "lib" ]; then cp -r lib backup_files/; fi
          if [ -f "pubspec.yaml" ]; then cp pubspec.yaml backup_files/; fi
          
          flutter create . --org com.example --project-name zajel_app --platforms=android
          
          if [ -d "backup_files/lib" ]; then rm -rf lib/* && cp -r backup_files/lib/* lib/; fi
          if [ -f "backup_files/pubspec.yaml" ]; then cp backup_files/pubspec.yaml ./; fi
          
          BUILD_FILE="android/app/build.gradle"
          if [ -f "$BUILD_FILE" ]; then
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/g' "$BUILD_FILE"
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/g' "$BUILD_FILE"
          fi

      - run: flutter pub get
      - run: flutter build apk --release --no-shrink --no-tree-shake-icons
