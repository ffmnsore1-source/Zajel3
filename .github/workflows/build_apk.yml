name: Build Flutter APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
      
      - name: Create fresh complete Flutter project and fix Kotlin
        run: |
          # حفظ الكود الأصلي
          mkdir -p temp_lib temp_pubspec
          if [ -d "lib" ]; then cp -r lib/* temp_lib/; fi
          if [ -f "pubspec.yaml" ]; then cp pubspec.yaml temp_pubspec/; fi
          
          # إنشاء مشروع جديد كلياً
          flutter create . --org com.example --project-name zajel_app --platforms=android
          
          # استعادة الكود الأصلي
          if [ -d "temp_lib" ] && [ "$(ls -A temp_lib)" ]; then rm -rf lib/* && cp -r temp_lib/* lib/; fi
          if [ -f "temp_pubspec/pubspec.yaml" ]; then cp temp_pubspec/pubspec.yaml ./; fi
          
          # ضبط الحد الأدنى لإصدار الأندرويد
          BUILD_FILE="android/app/build.gradle"
          if [ -f "$BUILD_FILE" ]; then
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/g' "$BUILD_FILE"
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/g' "$BUILD_FILE"
          fi
          
          # تحديث إصدار كوتلن القسري ليتوافق مع أحدث حزم فلاتر
          SETTINGS_FILE="android/settings.gradle"
          if [ -f "$SETTINGS_FILE" ]; then
            sed -i "s/version '1.8.22' version '1.9.24'/g" "$SETTINGS_FILE" || true
          fi
          
          PROJECT_GRADLE="android/build.gradle"
          if [ -f "$PROJECT_GRADLE" ]; then
            sed -i "s/ext.kotlin_version = .*/ext.kotlin_version = '1.9.24'/g" "$PROJECT_GRADLE" || true
          fi

      - run: flutter pub get
      - run: flutter build apk --release --no-shrink --no-tree-shake-icons
